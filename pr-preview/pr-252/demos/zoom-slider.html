<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Zoom slider</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css"><link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
<main id="app" class="demo" v-cloak>
  <div class="demo-grid">
    <section class="stage">
      <croppa v-model="croppa" :width="340" :height="260" :initial-image="imageUrl" prevent-white-space
        @init="onInit" @new-image-drawn="onReady" @zoom="sync"></croppa>
    </section>
    <section class="panel">
      <div><p class="eyebrow">Recipe</p><h2>Zoom slider</h2><p>Drive the v1 scale state from an ordinary range input.</p></div>
      <label>Zoom · {{ Number(scale).toFixed(2) }}×
        <input id="zoom-range" type="range" v-model.number="scale" :min="minScale" :max="maxScale" step="0.01" @input="applyScale">
      </label>
      <div class="controls">
        <button id="reset-zoom" @click="resetZoom">Reset zoom</button>
      </div>
      <div class="status ready">Scale {{ Number(scale).toFixed(3) }}</div>
      <pre>{{ metadata }}</pre>
    </section>
  </div>
</main>
<script src="../vendor/vue2.min.js"></script><script src="../vendor/vue-croppa.js"></script>
<script>
Vue.use(Croppa)
new Vue({
  el:'#app',
  data:{croppa:null,imageUrl:'../demo-image.svg',scale:1,minScale:1,maxScale:3,metadata:'{}'},
  methods:{
    onInit(vm){window.__croppa=vm;window.__demoMounted=true},
    onReady(){
      this.minScale=this.croppa.scaleRatio
      this.maxScale=this.minScale*3
      this.scale=this.minScale
      this.sync()
      window.__demoReady=true
    },
    applyScale(){this.croppa.scaleRatio=Number(this.scale);this.$nextTick(this.sync)},
    resetZoom(){this.scale=this.minScale;this.applyScale()},
    sync(){
      if(!this.croppa||!this.croppa.hasImage())return
      this.scale=this.croppa.scaleRatio
      this.metadata=JSON.stringify(this.croppa.getMetadata(),null,2)
      window.__metadata=this.croppa.getMetadata()
    }
  }
})
</script>
</body></html>
