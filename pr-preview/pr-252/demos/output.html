<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Output</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css">
  <link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
  <main id="app" class="demo" v-cloak>
    <div class="demo-grid">
      <section class="stage">
        <croppa
          v-model="croppa"
          :width="340"
          :height="240"
          :quality="2"
          :initial-image="imageUrl"
          prevent-white-space
          @init="onInit"
          @new-image-drawn="onReady"
        ></croppa>
      </section>
      <section class="panel">
        <div>
          <p class="eyebrow">Output</p>
          <h2>Generate real image output</h2>
          <p>The Blob and data URL below come from the canvas generated by Croppa.</p>
        </div>
        <div class="controls">
          <button id="blob" class="primary" @click="makeBlob">Generate PNG Blob</button>
          <button id="data-url" @click="makeDataUrl">Generate data URL</button>
        </div>
        <div :class="['status', outputReady ? 'ready' : '']">{{ status }}</div>
        <img v-if="preview" id="output-preview" class="output-image" :src="preview" alt="Generated crop output">
        <pre id="output-info">{{ outputInfo }}</pre>
      </section>
    </div>
  </main>
  <script src="../vendor/vue2.min.js"></script>
  <script src="../vendor/vue-croppa.js"></script>
  <script>
    Vue.use(Croppa)
    new Vue({
      el: '#app',
      data: {
        croppa: null,
        imageUrl: '../demo-image.svg',
        outputReady: false,
        status: 'Waiting for image…',
        preview: '',
        outputInfo: 'No output generated'
      },
      methods: {
        onInit(vm) { window.__croppa = vm; window.__demoMounted = true },
        onReady() { this.status = 'Image ready'; window.__demoReady = true },
        async makeBlob() {
          var blob = await this.croppa.promisedBlob('image/png')
          if (this.preview) URL.revokeObjectURL(this.preview)
          this.preview = URL.createObjectURL(blob)
          this.outputReady = true
          this.status = 'PNG Blob generated'
          this.outputInfo = JSON.stringify({ type: blob.type, size: blob.size }, null, 2)
          window.__lastBlob = { type: blob.type, size: blob.size }
        },
        makeDataUrl() {
          var value = this.croppa.generateDataUrl('image/png')
          this.preview = value
          this.outputReady = true
          this.status = 'PNG data URL generated'
          this.outputInfo = value.slice(0, 64) + '…'
          window.__lastDataUrl = value
        }
      }
    })
  </script>
</body>
</html>
