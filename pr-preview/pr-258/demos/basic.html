<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Basic</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css">
  <link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
  <main id="app" class="demo" v-cloak>
    <div class="demo-grid">
      <section class="stage">
        <croppa
          v-model="croppa"
          :width="360"
          :height="260"
          :quality="2"
          :initial-image="imageUrl"
          initial-size="cover"
          :prevent-white-space="preventWhiteSpace"
          @init="onInit"
          @new-image-drawn="onReady"
        ></croppa>
      </section>
      <section class="panel">
        <div>
          <p class="eyebrow">Basic crop</p>
          <h2>Drag, zoom and reset</h2>
          <p>This is the real v1 component running from the repository bundle, not an external embed.</p>
        </div>
        <div class="controls">
          <button id="zoom-in" @click="run('zoomIn')">Zoom in</button>
          <button id="zoom-out" @click="run('zoomOut')">Zoom out</button>
          <button id="move-left" @click="moveLeft">Move left</button>
          <button id="reset" class="primary" @click="reset">Reset</button>
        </div>
        <label>
          <input id="prevent-white-space" type="checkbox" v-model="preventWhiteSpace">
          Prevent whitespace
        </label>
        <div :class="['status', ready ? 'ready' : '']">{{ ready ? 'Image ready' : 'Loading image…' }}</div>
        <pre id="metadata">{{ metadata }}</pre>
      </section>
    </div>
  </main>
  <script src="../vendor/vue2.min.js"></script>
  <script src="../vendor/vue-croppa.js"></script>
  <script>
    Vue.use(Croppa)
    new Vue({
      el: '#app',
      data: {
        croppa: null,
        imageUrl: '../demo-image.svg',
        preventWhiteSpace: true,
        ready: false,
        metadata: '{}'
      },
      methods: {
        onInit(vm) {
          window.__croppa = vm
          window.__demoMounted = true
        },
        onReady() {
          this.ready = true
          this.sync()
          window.__demoReady = true
        },
        sync() {
          if (!this.croppa || !this.croppa.hasImage()) return
          this.metadata = JSON.stringify(this.croppa.getMetadata(), null, 2)
          window.__metadata = this.croppa.getMetadata()
        },
        run(method) {
          this.croppa[method]()
          this.$nextTick(this.sync)
        },
        moveLeft() {
          this.croppa.moveLeftwards(16)
          this.$nextTick(this.sync)
        },
        reset() {
          this.ready = false
          window.__demoReady = false
          this.croppa.refresh()
        }
      }
    })
  </script>
</body>
</html>
