<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Download recipe</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css"><link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
<main id="app" class="demo" v-cloak>
 <div class="demo-grid">
  <section class="stage"><croppa v-model="croppa" :width="330" :height="250" :initial-image="imageUrl" prevent-white-space @init="onInit" @new-image-drawn="onReady"></croppa></section>
  <section class="panel">
   <div><p class="eyebrow">Download recipe</p><h2>Create a downloadable crop</h2><p>Generate a data URL, attach it to an anchor, and let the browser save the cropped image.</p></div>
   <button id="prepare-download" class="primary" @click="prepare">Prepare download</button>
   <a v-if="href" id="download-link" class="button" :href="href" download="vue-croppa.png">Download PNG</a>
   <div :class="['status', href ? 'ready' : '']">{{ href ? 'Download ready' : 'Image ready' }}</div>
  </section>
 </div>
</main>
<script src="../vendor/vue2.min.js"></script><script src="../vendor/vue-croppa.js"></script>
<script>
Vue.use(Croppa)
new Vue({
 el:'#app',data:{croppa:null,imageUrl:'../demo-image.svg',href:''},
 methods:{
  onInit(vm){window.__croppa=vm;window.__demoMounted=true},
  onReady(){window.__demoReady=true},
  prepare(){this.href=this.croppa.generateDataUrl('image/png');window.__downloadHref=this.href}
 }
})
</script>
</body></html>
