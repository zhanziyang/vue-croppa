<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Rounded output</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css">
  <link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
  <main id="app" class="demo" v-cloak>
    <div class="demo-grid">
      <section class="stage">
        <croppa
          v-model="croppa"
          :width="300"
          :height="300"
          :quality="2"
          :initial-image="imageUrl"
          prevent-white-space
          image-border-radius="150"
          @init="onInit"
          @new-image-drawn="onReady"
        ></croppa>
      </section>
      <section class="panel">
        <div>
          <p class="eyebrow">Rounded output</p>
          <h2>Clip the exported image</h2>
          <p><code>image-border-radius</code> affects the canvas output when whitespace prevention is enabled.</p>
        </div>
        <button id="generate" class="primary" @click="generate">Generate rounded PNG</button>
        <img v-if="preview" id="rounded-preview" class="output-image" :src="preview" alt="Rounded crop output">
        <div :class="['status', preview ? 'ready' : '']">{{ preview ? 'Output generated' : 'Ready to export' }}</div>
      </section>
    </div>
  </main>
  <script src="../vendor/vue2.min.js"></script>
  <script src="../vendor/vue-croppa.js"></script>
  <script>
    Vue.use(Croppa)
    new Vue({
      el: '#app',
      data: { croppa: null, imageUrl: '../demo-image.svg', preview: '' },
      methods: {
        onInit(vm) { window.__croppa = vm; window.__demoMounted = true },
        onReady() { window.__demoReady = true },
        async generate() {
          var blob = await this.croppa.promisedBlob('image/png')
          this.preview = URL.createObjectURL(blob)
          window.__lastBlob = { size: blob.size, type: blob.type }
        }
      }
    })
  </script>
</body>
</html>
