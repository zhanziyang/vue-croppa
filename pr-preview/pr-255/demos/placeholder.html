<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Image placeholder</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css"><link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
<main id="app" class="demo" v-cloak>
 <div class="demo-grid">
  <section class="stage">
   <croppa v-model="croppa" :width="320" :height="260" placeholder="Drop an image here" :placeholder-font-size="18"
     placeholder-color="#0f766e" @init="onInit" @new-image-drawn="onReady">
     <img slot="placeholder" src="../logo.svg">
   </croppa>
  </section>
  <section class="panel">
   <div><p class="eyebrow">Empty state</p><h2>Image placeholder slot</h2><p>The placeholder image and text are rendered into Croppa's canvas before a file is chosen.</p></div>
   <div class="controls"><button id="choose" class="primary" @click="croppa.chooseFile()">Choose image</button><button id="remove" @click="croppa.remove()">Back to placeholder</button></div>
   <div class="status ready">Placeholder canvas is live</div>
  </section>
 </div>
</main>
<script src="../vendor/vue2.min.js"></script><script src="../vendor/vue-croppa.js"></script>
<script>
Vue.use(Croppa)
new Vue({
 el:'#app',data:{croppa:null},
 methods:{
  onInit(vm){window.__croppa=vm;window.__demoMounted=true;this.$nextTick(()=>{window.__placeholderData=vm.getCanvas().toDataURL('image/png')})},
  onReady(){window.__demoReady=true}
 }
})
</script>
</body></html>
