<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Responsive sizing</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css"><link rel="stylesheet" href="./shared/demo.css">
  <style>.responsive-croppa{display:block;transition:none!important}.responsive-croppa canvas{transition:none!important}</style>
</head>
<body>
<main id="app" class="demo" v-cloak>
  <div class="demo-grid">
    <section class="stage">
      <croppa ref="responsive" v-model="croppa" auto-sizing class="responsive-croppa"
        :style="{width: viewportWidth+'px',height: viewportHeight+'px'}"
        :initial-image="imageUrl" prevent-white-space @init="onInit" @new-image-drawn="onReady"></croppa>
    </section>
    <section class="panel">
      <div><p class="eyebrow">Sizing</p><h2>Responsive container</h2><p>v1 auto-sizing reads the rendered container size and keeps the canvas in sync on resize.</p></div>
      <label>Width · {{ viewportWidth }}px<input id="width-range" type="range" min="220" max="420" step="10" v-model.number="viewportWidth" @input="resize"></label>
      <label>Height · {{ viewportHeight }}px<input id="height-range" type="range" min="180" max="340" step="10" v-model.number="viewportHeight" @input="resize"></label>
      <div class="controls"><button id="compact" @click="setSize(240,200)">Compact</button><button id="large" class="primary" @click="setSize(400,300)">Large</button></div>
      <div class="status ready">{{ actual }}</div>
    </section>
  </div>
</main>
<script src="../vendor/vue2.min.js"></script><script src="../vendor/vue-croppa.js"></script>
<script>
Vue.use(Croppa)
new Vue({
 el:'#app',
 data:{croppa:null,imageUrl:'../demo-image.svg',viewportWidth:340,viewportHeight:260,actual:'Sizing…'},
 methods:{
  onInit(vm){window.__croppa=vm;window.__demoMounted=true},
  onReady(){this.measure();window.__demoReady=true},
  resize(){this.$nextTick(()=>{window.dispatchEvent(new Event('resize'));this.$nextTick(this.measure)})},
  setSize(w,h){this.viewportWidth=w;this.viewportHeight=h;this.resize()},
  measure(){
    if(!this.croppa)return
    this.actual=Math.round(this.croppa.realWidth)+' × '+Math.round(this.croppa.realHeight)+' display px'
    window.__actualSize={width:this.croppa.realWidth,height:this.croppa.realHeight,outputWidth:this.croppa.outputWidth,outputHeight:this.croppa.outputHeight}
  }
 }
})
</script>
</body></html>
