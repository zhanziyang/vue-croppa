<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Input</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css">
  <link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
  <main id="app" class="demo" v-cloak>
    <div class="demo-grid">
      <section class="stage">
        <croppa
          v-model="croppa"
          :width="340"
          :height="260"
          :quality="2"
          accept="image/*"
          :file-size-limit="5000000"
          placeholder="Choose or drop an image"
          replace-drop
          @init="onInit"
          @file-choose="log('file-choose')"
          @new-image="log('new-image')"
          @new-image-drawn="onReady"
          @image-remove="onRemove"
          @file-type-mismatch="log('file-type-mismatch')"
          @file-size-exceed="log('file-size-exceed')"
        ></croppa>
      </section>
      <section class="panel">
        <div>
          <p class="eyebrow">Input</p>
          <h2>File chooser + drag & drop</h2>
          <p>The input is local and testable. Replace-drop is enabled so another file can be dropped immediately.</p>
        </div>
        <div class="controls">
          <button id="choose" class="primary" @click="croppa.chooseFile()">Choose image</button>
          <button id="remove" class="danger" @click="croppa.remove()" :disabled="!hasImage">Remove</button>
        </div>
        <div :class="['status', hasImage ? 'ready' : '']">{{ hasImage ? 'Image loaded' : 'Waiting for image' }}</div>
        <pre id="events">{{ events.join('\n') || 'No events yet' }}</pre>
      </section>
    </div>
  </main>
  <script src="../vendor/vue2.min.js"></script>
  <script src="../vendor/vue-croppa.js"></script>
  <script>
    Vue.use(Croppa)
    new Vue({
      el: '#app',
      data: { croppa: null, hasImage: false, events: [] },
      methods: {
        onInit(vm) {
          window.__croppa = vm
          window.__demoMounted = true
        },
        log(name) {
          this.events.push(name)
          window.__events = this.events.slice()
        },
        onReady() {
          this.hasImage = true
          this.log('new-image-drawn')
          window.__demoReady = true
        },
        onRemove() {
          this.hasImage = false
          this.log('image-remove')
          window.__demoReady = false
        }
      }
    })
  </script>
</body>
</html>
