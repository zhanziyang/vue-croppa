<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Upload recipe</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css"><link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
<main id="app" class="demo" v-cloak>
 <div class="demo-grid">
  <section class="stage"><croppa v-model="croppa" :width="330" :height="250" :initial-image="imageUrl" prevent-white-space @init="onInit" @new-image-drawn="onReady"></croppa></section>
  <section class="panel">
   <div><p class="eyebrow">Upload recipe</p><h2>Blob → FormData</h2><p>This demo prepares the exact browser payload you would send to your own upload endpoint; it deliberately makes no external request.</p></div>
   <button id="prepare-upload" class="primary" @click="prepare">Prepare FormData</button>
   <div :class="['status', prepared ? 'ready' : '']">{{ prepared ? 'Upload payload ready' : 'Image ready' }}</div>
   <pre id="upload-info">{{ info }}</pre>
  </section>
 </div>
</main>
<script src="../vendor/vue2.min.js"></script><script src="../vendor/vue-croppa.js"></script>
<script>
Vue.use(Croppa)
new Vue({
 el:'#app',data:{croppa:null,imageUrl:'../demo-image.svg',prepared:false,info:'Not prepared'},
 methods:{
  onInit(vm){window.__croppa=vm;window.__demoMounted=true},
  onReady(){window.__demoReady=true},
  async prepare(){
   const blob=await this.croppa.promisedBlob('image/jpeg',.9)
   const body=new FormData();body.append('image',blob,'crop.jpg')
   const file=body.get('image')
   this.prepared=true
   this.info=JSON.stringify({name:file.name,type:file.type,size:file.size},null,2)
   window.__uploadPayload={name:file.name,type:file.type,size:file.size,hasFormData:body instanceof FormData}
  }
 }
})
</script>
</body></html>
