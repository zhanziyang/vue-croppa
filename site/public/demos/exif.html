<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · EXIF orientation</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css"><link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
<main id="app" class="demo" v-cloak>
 <div class="demo-grid">
  <section class="stage">
   <croppa v-model="croppa" :width="320" :height="260" @init="onInit" @new-image-drawn="onReady">
    <img slot="initial" src="../demo-image.svg" data-exif-orientation="6">
   </croppa>
  </section>
  <section class="panel">
   <div><p class="eyebrow">Orientation</p><h2>Initial-image EXIF hint</h2><p>For an initial slot image, v1 can read data-exif-orientation and normalize the displayed image.</p></div>
   <div class="status ready">Orientation: {{ orientation }}</div>
   <pre>&lt;img slot="initial" data-exif-orientation="6"&gt;</pre>
  </section>
 </div>
</main>
<script src="../vendor/vue2.min.js"></script><script src="../vendor/vue-croppa.js"></script>
<script>
Vue.use(Croppa)
new Vue({
 el:'#app',data:{croppa:null,orientation:null},
 methods:{
  onInit(vm){window.__croppa=vm;window.__demoMounted=true},
  onReady(){this.orientation=this.croppa.getMetadata().orientation;window.__orientation=this.orientation;window.__demoReady=true}
 }
})
</script>
</body></html>
