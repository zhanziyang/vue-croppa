<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Metadata</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css">
  <link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
  <main id="app" class="demo" v-cloak>
    <div class="demo-grid">
      <section class="stage">
        <croppa
          v-model="croppa"
          :width="340"
          :height="260"
          :quality="2"
          :initial-image="imageUrl"
          prevent-white-space
          @init="onInit"
          @new-image-drawn="onReady"
        ></croppa>
      </section>
      <section class="panel">
        <div>
          <p class="eyebrow">Persistence</p>
          <h2>Save and restore metadata</h2>
          <p>Capture the current transform, change it, then apply the saved metadata back.</p>
        </div>
        <div class="controls">
          <button id="save" class="primary" @click="save">Save metadata</button>
          <button id="change" @click="change">Change crop</button>
          <button id="restore" @click="restore" :disabled="!saved">Restore</button>
        </div>
        <div :class="['status', saved ? 'ready' : '']">{{ message }}</div>
        <pre id="metadata">{{ current }}</pre>
      </section>
    </div>
  </main>
  <script src="../vendor/vue2.min.js"></script>
  <script src="../vendor/vue-croppa.js"></script>
  <script>
    Vue.use(Croppa)
    new Vue({
      el: '#app',
      data: { croppa: null, imageUrl: '../demo-image.svg', saved: null, current: '{}', message: 'Image loading…' },
      methods: {
        onInit(vm) { window.__croppa = vm; window.__demoMounted = true },
        onReady() { this.sync(); this.message = 'Ready'; window.__demoReady = true },
        sync() {
          var value = this.croppa.getMetadata()
          this.current = JSON.stringify(value, null, 2)
          window.__metadata = value
        },
        save() {
          this.saved = Object.assign({}, this.croppa.getMetadata())
          window.__savedMetadata = Object.assign({}, this.saved)
          this.message = 'Metadata saved'
          this.sync()
        },
        change() {
          this.croppa.move({ x: -28, y: -18 })
          this.croppa.zoomIn()
          this.message = 'Crop changed'
          setTimeout(this.sync, 30)
        },
        restore() {
          this.croppa.applyMetadata(this.saved)
          this.message = 'Saved metadata applied'
          setTimeout(() => {
            this.sync()
            window.__restoredMetadata = this.croppa.getMetadata()
          }, 80)
        }
      }
    })
  </script>
</body>
</html>
