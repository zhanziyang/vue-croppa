<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Draw attachment</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css"><link rel="stylesheet" href="./shared/demo.css">
  <style>.source-badge{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}</style>
</head>
<body>
<main id="app" class="demo" v-cloak>
  <img ref="badge" class="source-badge" src="../logo.svg" alt="">
  <div class="demo-grid">
    <section class="stage">
      <croppa v-model="croppa" :width="340" :height="260" :quality="2" :initial-image="imageUrl" prevent-white-space
        @init="onInit" @new-image-drawn="onReady" @draw="onDraw"></croppa>
    </section>
    <section class="panel">
      <div><p class="eyebrow">Canvas hook</p><h2>Watermark / attachment</h2><p>The draw event receives the real canvas context after Croppa renders the image.</p></div>
      <label><input id="toggle-badge" type="checkbox" v-model="showBadge" @change="redraw"> Show badge</label>
      <div class="controls"><button id="refresh-draw" @click="redraw">Redraw</button><button id="export" class="primary" @click="exportImage">Export</button></div>
      <img v-if="preview" id="attachment-preview" class="output-image" :src="preview" alt="Watermarked crop">
      <div class="status ready">Draw hooks: {{ drawCount }}</div>
    </section>
  </div>
</main>
<script src="../vendor/vue2.min.js"></script><script src="../vendor/vue-croppa.js"></script>
<script>
Vue.use(Croppa)
new Vue({
 el:'#app',
 data:{croppa:null,imageUrl:'../demo-image.svg',showBadge:true,drawCount:0,preview:''},
 methods:{
  onInit(vm){window.__croppa=vm;window.__demoMounted=true},
  onReady(){window.__demoReady=true},
  onDraw(ctx){
    this.drawCount++
    if(this.showBadge&&this.$refs.badge&&this.$refs.badge.complete){
      const size=Math.max(54,Math.round(ctx.canvas.width*.16))
      const pad=Math.round(ctx.canvas.width*.04)
      ctx.save();ctx.globalAlpha=.88
      ctx.drawImage(this.$refs.badge,ctx.canvas.width-size-pad,ctx.canvas.height-size-pad,size,size)
      ctx.restore()
    }
    window.__drawCount=this.drawCount
  },
  redraw(){if(this.croppa&&this.croppa.hasImage())this.croppa._draw()},
  exportImage(){this.preview=this.croppa.generateDataUrl('image/png');window.__lastDataUrl=this.preview}
 }
})
</script>
</body></html>
