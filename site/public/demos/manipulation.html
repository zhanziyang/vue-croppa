<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vue Croppa · Manipulation</title>
  <link rel="stylesheet" href="../vendor/vue-croppa.css">
  <link rel="stylesheet" href="./shared/demo.css">
</head>
<body>
  <main id="app" class="demo" v-cloak>
    <div class="demo-grid">
      <section class="stage">
        <croppa
          v-model="croppa"
          :width="340"
          :height="280"
          :quality="2"
          :initial-image="imageUrl"
          prevent-white-space
          @init="onInit"
          @new-image-drawn="onReady"
          @move="sync"
          @zoom="sync"
        ></croppa>
      </section>
      <section class="panel">
        <div>
          <p class="eyebrow">Manipulation</p>
          <h2>Move, zoom, rotate, flip</h2>
          <p>Each button calls the same public methods available to your app.</p>
        </div>
        <div class="controls">
          <button id="move-up" @click="doMove('moveUpwards')">↑ Move</button>
          <button id="move-right" @click="doMove('moveRightwards')">→ Move</button>
          <button id="zoom-in" @click="doCall('zoomIn')">＋ Zoom</button>
          <button id="zoom-out" @click="doCall('zoomOut')">− Zoom</button>
          <button id="rotate" class="primary" @click="doCall('rotate')">Rotate 90°</button>
          <button id="flip-x" @click="doCall('flipX')">Flip X</button>
          <button id="flip-y" @click="doCall('flipY')">Flip Y</button>
        </div>
        <div class="status ready">Live metadata</div>
        <pre id="metadata">{{ metadata }}</pre>
      </section>
    </div>
  </main>
  <script src="../vendor/vue2.min.js"></script>
  <script src="../vendor/vue-croppa.js"></script>
  <script>
    Vue.use(Croppa)
    new Vue({
      el: '#app',
      data: { croppa: null, imageUrl: '../demo-image.svg', metadata: '{}' },
      methods: {
        onInit(vm) { window.__croppa = vm; window.__demoMounted = true },
        onReady() { this.sync(); window.__demoReady = true },
        sync() {
          if (!this.croppa || !this.croppa.hasImage()) return
          var value = this.croppa.getMetadata()
          this.metadata = JSON.stringify(value, null, 2)
          window.__metadata = value
        },
        doCall(method) {
          this.croppa[method]()
          setTimeout(this.sync, 40)
        },
        doMove(method) {
          this.croppa[method](16)
          this.$nextTick(this.sync)
        }
      }
    })
  </script>
</body>
</html>
